<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>测试</title></head>
<body>
<h2>正在测试线上页面...</h2>
<iframe src="https://18256302582-ship-it.github.io/wechat-weekly/" width="100%" height="800px"></iframe>
<script>
setTimeout(() => {
  const iframe = document.querySelector('iframe');
  const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  
  // 测试点击 p7 Tab
  const p7Tab = Array.from(iframeDoc.querySelectorAll('.tab-btn')).find(btn => 
    btn.textContent.includes('2026.6.2–6.8')
  );
  
  if (p7Tab) {
    console.log('找到 p7 Tab，模拟点击...');
    p7Tab.click();
    
    setTimeout(() => {
      const p7Content = iframeDoc.getElementById('p7');
      const isVisible = p7Content && p7Content.classList.contains('active');
      console.log('p7 内容是否显示:', isVisible);
      console.log('p7 dim-block 数量:', iframeDoc.querySelectorAll('#p7 .dim-block').length);
    }, 500);
  }
}, 2000);
</script>
</body>
</html>
